# Legacy Log4j 1 document. LogConfigurator translates console / dailyRollingFile,
# conversionPattern and datePattern into Log4j 2. It does not copy application settings.
rootLogger: INFO,console,file


appender:
  console:
    type: console
    threshold: INFO
    layout:
      type: consolePattern
      conversionPattern: "[%d{ISO8601}][%-5p][%-25c] %m%n"

  file:
    type: dailyRollingFile
    file: ${path.logs}/${cluster.name}.log
    datePattern: "'.'yyyy-MM-dd"
    layout:
      type: pattern
      conversionPattern: "[%d{ISO8601}][%-5p][%-25c] %m%n"